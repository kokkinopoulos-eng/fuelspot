name: fuelspot
description: Βρες τα φθηνότερα καύσιμα κοντά σου
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3
  geolocator: ^12.0.0
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  url_launcher: ^6.2.6
  flutter_native_splash: ^2.4.8
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/bg.png


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D3F6B"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  color: "#0D3F6B"
  image: assets/icon/icon.png
  android_12:
    color: "#0D3F6B"
    image: assets/icon/icon.png
